\":\"W kwietniu\",\"may\":\"W maju\",\"june\":\"W czerwcu\",\"july\":\"W lipcu\",\"august\":\"W sierpniu\",\"september\":\"We wrześniu\",\"october\":\"W październiku\",\"november\":\"W listopadzie\",\"december\":\"W grudniu\"}}},\"additionalOptions\":{\"salary\":\"Wynagrodzenie\",\"contributionsAndTaxes\":\"Składki i podatki\",\"participationInPPK\":\"Uczestnictwo w PPK\",\"PPKEmployer\":\"PPK pracodawca:\",\"PPKEmployee\":\"PPK pracownik:\",\"selectPlaceholder\":\"Wybierz\",\"voluntaryHealthInsurance\":\"Dobrowolne ubezpieczenie chorobowe\",\"zusOptions\":{\"employer\":\"ZUS płacę u tego pracodawcy\",\"otherEmployer\":\"ZUS płacę u innego pracodawcy\",\"student\":\"Jestem studentem, \u003c26 lat\",\"notEmployed\":\"Nie jestem nigdzie zatrudniony\",\"full\":\"Pełny ZUS (brak ulg)\",\"reduced\":\"Preferencyjna składka\",\"start\":\"Brak ZUS, Ulga na start\"},\"accidentInsurance\":\"Ubezpieczenie wypadkowe\",\"jointEmployment\":\"Jestem jednocześnie zatrudniony na umowę o pracę u tego samego pracodawcy\",\"flatRateTax\":\"Zryczałtowany podatek\",\"lumpSumTaxRate\":\"Stawka ryczałtu\",\"vat\":\"Podatek VAT\",\"zus\":\"ZUS\",\"allowancesAndReliefs\":\"Dodatki i ulgi\",\"authorizedPayers\":\"Liczba płatników upoważnionych do zmniejszania zaliczek na PIT\",\"authorizedPayersTooltip\":\"Wybierz, ilu pracodawców może w Twoim imieniu pomniejszać zaliczkę na podatek dochodowy (PIT). Najczęściej jest to 1, jeśli pracujesz tylko u jednego pracodawcy. Jeśli masz kilka źródeł dochodu (np. kilka umów), upewnij się, że tylko jeden z nich ma takie upoważnienie – w przeciwnym razie możesz mieć niedopłatę podatku.\",\"workInResidence\":\"Praca w miejscu zamieszkania\",\"under26YearOldTaxRelief\":\"Ulga dla osób poniżej 26. roku życia\",\"under26taxFreeAmount\":\"Kwota wolna od podatku dla osób poniżej 26. roku życia\",\"obtainingIncomeCost\":\"Kosztów uzyskania przychodu\",\"obtainingIncomeCostTooltip\":\"Koszty uzyskania przychodu to część Twojego wynagrodzenia, od której nie płacisz podatku – bo uznaje się, że to wydatek związany z pracą. Dla większości zleceń domyślnie stosuje się 20%. Wybierz 50% tylko wtedy, gdy zlecenie dotyczy praw autorskich lub pracy twórczej (np. projektowanie, pisanie, programowanie z przeniesieniem praw autorskich). Jeśli nie jesteś pewien – zostaw 20%.\",\"incomeCost\":\"Koszt uzyskania przychodu\"},\"salaryExplainer\":{\"intro\":{\"paragraph\":\"Wybór odpowiedniej formy zatrudnienia ma kluczowe znaczenie dla wysokości wynagrodzenia netto oraz korzyści związanych z zatrudnieniem. Warto znać wszystkie aspekty obliczania wynagrodzenia, aby świadomie podejmować decyzje dotyczące kariery zawodowej. Nasz \u003cspan\u003ekalkulator wynagrodzeń {year}\u003c/span\u003e pomoże Ci sprawdzić szacowaną wartość wynagrodzenia netto, aby ułatwić to zadanie.\"},\"contractTypes\":{\"title\":\"Rodzaje umów o pracę\",\"description\":\"W Polsce wyróżniamy kilka podstawowych form zatrudnienia, które bezpośrednio wpływają na wysokość wynagrodzenia netto:\",\"permanentContract\":{\"title\":\"Umowa o pracę:\",\"description\":\"Może być zawarta na czas nieokreślony, określony lub na okres próbny. Reguluje ją Kodeks pracy, zapewniając pracownikowi pełne prawa pracownicze, takie jak urlopy, świadczenia chorobowe czy okres wypowiedzenia.\"},\"mandateContract\":{\"title\":\"Umowa zlecenie:\",\"description\":\"Regulowana przez Kodeks cywilny, dotyczy wykonania określonych czynności na rzecz zleceniodawcy. Charakteryzuje się większą elastycznością, ale nie gwarantuje wszystkich praw pracowniczych.\"},\"specificTaskContract\":{\"title\":\"Umowa o dzieło:\",\"description\":\"Również regulowana przez Kodeks cywilny, dotyczy wykonania konkretnego dzieła. Nie podlega składkom na ubezpieczenia społeczne, co wpływa na wysokość wynagrodzenia netto.\"},\"b2b\":{\"title\":\"B2B (Business to Business):\",\"description\":\"Forma współpracy między dwoma podmiotami gospodarczymi. Osoba świadcząca usługi prowadzi własną działalność gospodarczą i wystawia faktury za wykonane usługi.\"}},\"contractDifferences\":{\"title\":\"Różnice między umowami wpływające na wynagrodzenie\",\"description\":\"Każda z form zatrudnienia ma swoje specyficzne cechy, które wpływają na ostateczną wysokość wynagrodzenia netto:\",\"permanentContract\":{\"description\":\"Zapewnia stabilność zatrudnienia i pełne prawa pracownicze, ale wiąże się z wyższymi kosztami dla pracodawcy i pracownika z uwagi na obowiązkowe składki na ubezpieczenia społeczne i zdrowotne. Podlega ogólnym zasadom podatkowy, czyli skali 12% oraz 32% (po przekroczeniu 120.000 dochodu).\"},\"mandateContract\":{\"description\":\"Oferuje większą elastyczność, jednak nie gwarantuje wszystkich świadczeń pracowniczych. Od 2021 roku obowiązują da niej również składki na ubezpieczenia społeczne, co zmniejsza różnicę w kosztach w porównaniu z umową o pracę.\"},\"specificTaskContract\":{\"description\":\"Nie podlega składkom na ubezpieczenia społeczne ani zdrowotne, co zwiększa wynagrodzenie netto. Jednak brak zabezpieczeń socjalnych dla wykonawcy jest dużym minusem jeżeli nie masz przychodów w postani innego typu umowy.\"},\"b2b\":{\"description\":\"Pozwala na optymalizację kosztów poprzez wybór formy opodatkowania i możliwość odliczania kosztów uzyskania przychodu. Wymaga jednak prowadzenia własnej działalności gospodarczej i samodzielnego opłacania składek.\"}},\"salaryComponents\":{\"title\":\"Składniki wynagrodzenia netto - jak obliczyć \u003cspan\u003ebrutto netto\u003c/span\u003e\",\"description1\":\"Wynagrodzenie netto to kwota, którą pracownik otrzymuje \\\"na rękę\\\" po odliczeniu wszystkich obowiązkowych składek i podatków. Używając \u003cspan\u003ekalkulatora brutto netto\u003c/span\u003e, możesz szybko obliczyć, ile szacunkowo wyniesie Twoja wypłata. Pamiętaj, że są to szacowane wartości, ponieważ wpływ na nie mają między innymi specyficzne dla Ciebie ulgi podatkowe.\",\"description2\":\"Na wynagrodzenie netto składają się:\",\"socialInsurance\":\"Składki na ubezpieczenia społeczne\",\"socialInsuranceDescription\":\"Emerytalne (9,76%), rentowe (1,5%), chorobowe (2,45%).\",\"pensionInsurance\":\"Składka na ubezpieczenie zdrowotne\",\"pensionInsuranceDescription\":\"9% podstawy wymiaru składki, czyli kwoty brutto pomniejszona o składki na ubezpiecznie społeczne.\",\"advanceTaxPayment\":\"Zaliczka na podatek dochodowy\",\"advanceTaxPaymentDescription\":\"Obliczana na podstawie skali podatkowej lub wybranej formy opodatkowania.\"},\"salaryStructure\":{\"title\":\"Struktura wynagrodzenia \u003cspan\u003ebrutto netto\u003c/span\u003e\",\"chartTitle\":\"Struktura składowych wynagrodzenia w różnych formach zatrudnienia\"},\"contractChoice\":{\"title\":\"Na co zwrócić uwagę przy wyborze typu umowy\",\"description\":\"Przy wyborze formy zatrudnienia zwróć uwagę na kilka kluczowych aspektów, które wpłyną na Twoje finanse:\",\"stability\":\"Stabilność zatrudnienia:\",\"stabilityDescription\":\"Umowa o pracę zapewnia największą stabilność i ochronę.\",\"netAmount\":\"Wysokość wynagrodzenia netto:\",\"netAmountDescription\":\"Umowy cywilnoprawne mogą oferować wyższe wynagrodzenie netto, ale kosztem mniejszej ochrony socjalnej.\",\"benefits\":\"Świadczenia dodatkowe:\",\"benefitsDescription\":\"Urlopy, świadczenia chorobowe czy macierzyńskie są gwarantowane tylko przy umowie o pracę.\",\"flexibility\":\"Elastyczność:\",\"flexibilityDescription\":\"Formy takie jak B2B czy umowa zlecenie oferują większą elastyczność w zakresie czasu i miejsca pracy.\"},\"taxationForms\":{\"title\":\"Różnice w formach opodatkowania - wpływ na obliczenia\",\"description\":\"W Polsce dostępnych jest kilka form opodatkowania, które znacząco wpływają na ostateczne wynagrodzenie netto:\",\"tableHeaders\":{\"form\":\"Forma opodatkowania\",\"rate\":\"Stawka podatkowa\",\"bestUse\":\"Najlepsze zastosowanie\"},\"taxScale\":{\"name\":\"Skala podatkowa\",\"rate\":\"12% do kwoty 120 000 zł dochodu rocznie, powyżej 32%\",\"bestUse\":\"Umowa o pracę, niskie i średnie dochody\"},\"linearTax\":{\"name\":\"Podatek liniowy\",\"rate\":\"19% niezależnie od wysokości dochodu\",\"bestUse\":\"B2B z wysokim dochodem i wysokimi kosztami\"},\"lumpSum\":{\"name\":\"Ryczałt od przychodów ewidencjonowanych\",\"rate\":\"Od 2% do 17% w zależności od rodzaju działalności\",\"bestUse\":\"B2B z wysoki dochodem i niskimi kosztami\"},\"taxCard\":{\"name\":\"Karta podatkowa\",\"rate\":\"Stała kwota ustalana przez urząd skarbowy\",\"bestUse\":\"Wybrane profesje usługowe\"},\"ipBox\":{\"name\":\"IP Box\",\"rate\":\"5% dla dochodów z kwalifikowanych praw własności intelektualnej\",\"bestUse\":\"Programiści, twórcy oprogramowania\"}},\"ppk\":{\"title\":\"Pracownicze Plany Kapitałowe (PPK) a wynagrodzenie netto\",\"description\":\"Pracownicze Plany Kapitałowe (PPK) to dobrowolny, długoterminowy program oszczędnościowy, który może wpłynąć na wysokość wypłacanego wynagrodzenia netto:\",\"employeeContribution\":\"Wpłata pracownika – wynosi co do zasady 2% wynagrodzenia brutto, z możliwością obniżenia do 0,5% w przypadku niskich zarobków.\",\"employerContribution\":\"Wpłata pracodawcy – standardowo wynosi 1,5% wynagrodzenia brutto, z możliwością dobrowolnej wpłaty dodatkowej do 2,5%.\",\"stateContributions\":\"Dopłaty od państwa – jednorazowa wpłata powitalna (250 zł) oraz coroczna dopłata (240 zł), pod warunkiem spełnienia określonych kryteriów.\",\"applicability\":\"PPK stosuje się wyłącznie w przypadku osób zatrudnionych na podstawie umowy o pracę lub umowy zlecenia (jeśli podlegają obowiązkowym ubezpieczeniom). Program nie obejmuje współpracy B2B.\"},\"specificTaskZus\":{\"title\":\"Umowa o dzieło a ZUS – wyjątki\",\"description\":\"Zasadniczo umowa o dzieło nie podlega obowiązkowym składkom ZUS, co zwiększa wynagrodzenie netto. Istnieją jednak wyjątki:\",\"withEmployer\":\"Jeśli zawierasz umowę o dzieło z własnym pracodawcą — czyli z firmą, z którą masz już podpisaną umowę o pracę — wtedy taka umowa podlega obowiązkowym składkom ZUS. W takim przypadku:\",\"contributionsNote\":\"Składki emerytalne, rentowe, chorobowe, wypadkowe oraz zdrowotne będą odprowadzane od wynagrodzenia z umowy o dzieło, tak jak w przypadku umowy o pracę. Również składka zdrowotna zostanie potrącona.\",\"otherEmployerNote\":\"Dodatkowo, jeśli wykonujesz dzieło na rzecz swojego pracodawcy, nawet jeśli umowa o dzieło jest zawarta z innym podmiotem, ZUS może uznać, że powinna być objęta składkami.\"},\"ipBox\":{\"title\":\"IP Box - możliwość optymalizacji podatkowej dla programistów i twórców\",\"description\":\"IP Box to preferencja podatkowa wprowadzona w Polsce w 2019 roku, umożliwiająca opodatkowanie dochodów z kwalifikowanych praw własności intelektualnej (IP) obniżoną stawką 5% podatku dochodowego. Jest to atrakcyjna opcja dla osób pracujących w branży IT:\",\"eligibility\":{\"title\":\"Kto może skorzystać z IP Box\",\"description\":\"Z ulgi IP Box mogą skorzystać przedsiębiorcy, którzy:\",\"research\":\"Prowadzą działalność badawczo-rozwojową\",\"createIP\":\"Wytwarzają, rozwijają lub ulepszają kwalifikowane prawa własności intelektualnej\",\"commercialize\":\"Osiągają dochody z komercjalizacji tych praw\",\"taxForms\":\"Rozliczają się na zasadach ogólnych (skala podatkowa) lub podatku liniowym\"},\"howToUse\":{\"title\":\"Jak rozliczyć IP Box\",\"recordKeeping\":\"Prowadzenie ewidencji: Należy prowadzić odrębną ewidencję dla dochodów z IP Box.\",\"qualifiedIncome\":\"Obliczenie dochodu kwalifikowanego: Na podstawie ewidencji należy obliczyć dochód podlegający preferencyjnemu opodatkowaniu.\",\"advances\":\"Płacenie zaliczek: W ciągu roku podatkowego należy płacić standardowe zaliczki na podatek dochodowy.\",\"annualSettlement\":\"Rozliczenie roczne: Wypełnić formularz PIT/IP (załącznik do PIT-36 lub PIT-36L).\",\"refund\":\"Zwrot nadpłaty: Po złożeniu zeznania rocznego można otrzymać zwrot nadpłaconego podatku.\"}},\"faq\":{\"title\":\"Najczęściej zadawane pytania (FAQ) o wynagrodzeniu \u003cspan\u003ebrutto netto\u003c/span\u003e\",\"items\":[{\"question\":\"Czy umowa o dzieło podlega składkom ZUS?\",\"answer\":\"Nie, umowa o dzieło nie podlega składkom na ubezpieczenia społeczne ani zdrowotne, co wpływa na wyższe wynagrodzenie netto, ale brak jest zabezpieczeń socjalnych dla wykonawcy.\\n\\nWyjątkiem jest sytuacja, gdy umowa o dzieło jest zawarta z własnym pracodawcą — wtedy podlega składkom ZUS tak jak umowa o pracę.\"},{\"question\":\"Czy przy umowie zlecenie przysługują urlopy?\",\"answer\":\"Umowa zlecenie nie gwarantuje prawa do płatnego urlopu wypoczynkowego. Jednak strony mogą ustalić inaczej w treści umowy. Warto pamiętać, że jest to jeden z elementów, który odróżnia umowę zlecenie od umowy o pracę i wpływa na różnice w całkowitym wynagrodzeniu.\"},{\"question\":\"Która forma zatrudnienia pozwala na najwyższe wynagrodzenie netto?\",\"answer\":\"Zazwyczaj B2B lub umowa o dzieło oferują wyższe wynagrodzenie netto, ponieważ wiążą się z niższymi obciążeniami podatkowymi i składkowymi. Szczególnie korzystne może być B2B z zastosowaniem IP Box (5% podatku) dla programistów i twórców oprogramowania.\\n\\nSzacowane wyliczenia możesz sprawdzić używając kalkulatora wynagrodzeń {year}.\"},{\"question\":\"Czy mogę pracować na kilku umowach jednocześnie?\",\"answer\":\"Tak, możesz łączyć różne formy zatrudnienia, np. mieć umowę o pracę i dodatkową umowę zlecenie. Każda z nich będzie rozliczana osobno pod względem składek i podatków. Warto jednak pamiętać o kilku zasadach:\\n• Umowa o dzieło z własnym pracodawcą podlega składkom ZUS\\n• Przy wielu źródłach dochodu opodatkowanych na skali podatkowej, może nastąpić przekroczenie progu podatkowego\\n• Przy niektórych formach współpracy mogą istnieć ograniczenia dotyczące konkurencji.\"},{\"question\":\"Co się dzieje z moim ubezpieczeniem zdrowotnym przy B2B?\",\"answer\":\"Przy B2B musisz samodzielnie opłacać składki ZUS, w tym składkę zdrowotną, której wysokość zależy od formy opodatkowania i wysokości dochodów. Od 2022 roku zasady obliczania składki zdrowotnej się zmieniły:\\n• Na skali podatkowej: 9% dochodu, bez możliwości odliczenia od podatku\\n• Na podatku liniowym: 4,9% dochodu, min. 9% minimalnego wynagrodzenia\\n• Na ryczałcie: składka zależna od przychodu, według progów przychodowych\"},{\"question\":\"Czy mogę odliczać koszty uzyskania przychodu przy różnych umowach?\",\"answer\":\"Tak, ale w różny sposób. Przy umowie o pracę są one zryczałtowane (250 zł miesięcznie lub 300 zł dla dojeżdżających z innej miejscowości), przy B2B możesz odliczać faktyczne koszty prowadzenia działalności, co może znacząco zmniejszyć podstawę opodatkowania.\\n\\nW przypadku umowy zlecenie możesz zastosować koszty ryczałtowe w wysokości 20% przychodu lub rozliczać koszty faktycznie poniesione.\"},{\"question\":\"Która forma umowy zapewnia największe bezpieczeństwo socjalne?\",\"answer\":\"Umowa o pracę gwarantuje pełne zabezpieczenie socjalne, w tym prawo do:\\n• Płatnego urlopu wypoczynkowego (20-26 dni w zależności od stażu pracy)\\n• Zasiłku chorobowego (80% wynagrodzenia) od pierwszego dnia niezdolności do pracy\\n• Ochrony przed nagłym zwolnieniem (okresy wypowiedzenia)\\n• Pełnego ubezpieczenia zdrowotnego i społecznego\\n• Świadczeń z tytułu macierzyństwa i rodzicielstwa\"},{\"question\":\"Czy mogę negocjować formę zatrudnienia z pracodawcą?\",\"answer\":\"Tak, forma zatrudnienia jest przedmiotem negocjacji. Warto przedyskutować to z pracodawcą, biorąc pod uwagę swoje potrzeby i preferencje. Coraz więcej firm oferuje elastyczne podejście do formy współpracy, szczególnie w branży IT.\\n\\nPamiętaj jednak, że wybór formy zatrudnienia powinien być świadomy i uwzględniać nie tylko wysokość wynagrodzenia netto, ale także kwestie związane z bezpieczeństwem socjalnym i ubezpieczeniami.\"},{\"question\":\"Jakie dokumenty są potrzebne do założenia działalności B2B?\",\"answer\":\"Aby założyć działalność gospodarczą, musisz:\\n1. Zarejestrować ją w CEIDG (Centralna Ewidencja i Informacja o Działalności Gospodarczej) - można to zrobić online\\n2. Uzyskać NIP (Numer Identyfikacji Podatkowej) i REGON (Rejestr Gospodarki Narodowej)\\n3. Założyć firmowe konto bankowe\\n4. Wybrać formę opodatkowania i zgłosić ją do urzędu skarbowego\\n5. Zgłosić się do ZUS w ciągu 7 dni od rozpoczęcia działalności\"},{\"question\":\"Czy zmiana formy zatrudnienia wpływa na moją zdolność kredytową?\",\"answer\":\"Tak, banki zazwyczaj preferują umowę o pracę na czas nieokreślony przy ocenie zdolności kredytowej, natomiast B2B wymaga udokumentowania stabilnych dochodów z działalności. Banki często wymagają:\\n• Dla umowy o pracę: minimum 3-6 miesięcy zatrudnienia na obecnej umowie\\n• Dla B2B: minimum 12-24 miesięcy prowadzenia działalności i stabilnych dochodów\\n• Dla umów zlecenie i o dzieło: historia współpracy z danym zleceniodawcą przez minimum 12 miesięcy\\n\\nWarto wziąć to pod uwagę, planując zmianę formy zatrudnienia, szczególnie jeśli w najbliższym czasie planujesz zaciągnąć kredyt hipoteczny.\"}]},\"net\":\"Netto\",\"zusLabel\":\"ZUS\",\"taxLabel\":\"Podatek\",\"legend\":{\"pensionDisability\":\"Składki emerytalne i rentowe\",\"sickness\":\"Składka chorobowa\",\"health\":\"Składka zdrowotna\",\"tax\":\"Podatek dochodowy\",\"net\":\"Netto\"},\"contractLabels\":{\"permanentContract\":\"Umowa o pracę\",\"mandateContract\":\"Umowa zlecenie\",\"specificTaskContract\":\"Umowa o dzieło\",\"b2bContract\":\"B2B\"}}},\"seo\":{\"title\":\"rocketjobs.pl | Oferty Pracy | Praca w Mojej Branży\",\"titleWithFilters\":\"Praca {category} {location} | rocketjobs.pl\",\"titleWithRemote\":\"Praca zdalna, praca z domu - rocketjobs.pl\",\"titleWithCompany\":\"Praca {companyName} | rocketjobs.pl\",\"description\":\"Twój portal z ofertami pracy\",\"descriptionWithFilters\":\"{count, plural, one {Praca {category} | {location} | {counter} aktualna oferta pracy. Wejdź i aplikuj na rocketjobs.pl} few {Praca {category} | {location} | {counter} aktualne oferty pracy. Wejdź i aplikuj na rocketjobs.pl} many {Praca {category} | {location} | {counter} aktua
