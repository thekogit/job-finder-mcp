utorskie narzędzie, które dostarcza informacji o zarobkach w konkretnych branżach i specjalizacjach. Informacje, jakie możesz uzyskać, powstają na podstawie danych, które pochodzą z ogłoszeń dostępnych na No Fluff Jobs.","SALARY_CALCULATOR_FILTER_DETAILS":"W odpowiedziach uwzględniamy kategorię, czyli twoją profesję, specjalizacje IT, lokalizację, poziom doświadczenia i rodzaj umowy. Zyskujesz dostęp do unikalnych, wartościowych danych na temat pracy w danej specjalizacji.","PREPARE_FOR_JOB_INTERVIEW_TITLE":"Szukam pracy i nie wiem ile zarobię na danym stanowisku. Skorzystaj z naszego kalkulatora, aby przygotować się do rozmowy z pracodawcą.","PREPARE_FOR_JOB_INTERVIEW_DESC":"Gdy szukasz pracy i nie wiesz jakie zarobki możesz zaproponować pracodawcy, zweryfikuj swoje obawy z kalkulatorem wynagrodzeń.","SALARY_CALCULATOR_DATA_DETAILS":"Z danych dowiesz się, jak wygląda rozkład zarobków, ile wynosi mediana na poszukiwanym stanowisku i poznasz 10% najniższych i najwyższych widełek.","IT_SALARY_CALCULATOR_TITLE":"Kalkulator zarobków dla specjalizacji IT","IT_SALARY_CALCULATOR_FILTER_INFO":"Jeśli sprawdzasz wynagrodzenia w branży IT, zobaczysz dodatkowy filtr, w którym wybierzesz technologię, która cię interesuje. Oczywiście najwięcej informacji uzyskasz wybierając w filtrze opcję “Any skills” (dowolne umiejętności).","SALARY_CALCULATOR_DISCLAIMER_FULL":"Nota: ten kalkulator ma charakter informacyjny i jest przeznaczony wyłącznie do użytku prywatnego. Nie należy go stosować do obliczania wynagrodzeń pracowników. No Fluff Jobs nie zapewnia dokładności wyników ani nie odpowiada za jego wykorzystanie w rozliczeniach między pracodawcami a pracownikami.","CAN_CALCULATOR_HELP_ME_TITLE":"Czy kalkulator płac może pomóc w ustaleniu, ile powinienem zarabiać?","CALCULATOR_NEGOTIATION_SUPPORT":"Kalkulator płac może stanowić punkt wyjścia do negocjacji podwyżki, ponieważ pozwala oszacować rynkowe wynagrodzenie na danym stanowisku. Jednak jego wyniki są orientacyjne, dlatego warto je uzupełnić dodatkowymi danymi, takimi jak raporty płacowe, doświadczenie zawodowe czy indywidualne osiągnięcia.","REPORT_NOT_AVAILABLE_TITLE":"Dlaczego raport wynagrodzeń nie jest dostępny dla moich danych?","REPORT_NOT_AVAILABLE_DESC":"Brak dostępnego raportu wynagrodzeń dla wprowadzonych danych w kalkulatorze może wynikać z kilku powodów.","REPORT_NOT_AVAILABLE_REASON_FEW_DATA":"\u003Cstrong>Zbyt mała liczba danych\u003C\u002Fstrong> – kalkulator wynagrodzeń może nie mieć wystarczającej ilości informacji dla podanych parametrów, np. rzadkiej kombinacji stanowiska, lokalizacji i doświadczenia.","REPORT_NOT_AVAILABLE_REASON_NO_DATA":"\u003Cstrong>Brak danych w bazie\u003C\u002Fstrong> – podane stanowisko lub branża są mniej popularne, kalkulator może nie dysponować odpowiednimi statystykami.","REPORT_NOT_AVAILABLE_REASON_SPECIFIC_FILTERS":"\u003Cstrong>Nietypowe kryteria\u003C\u002Fstrong> – użyłeś lub użylaś specyficznych filtrów (np. bardzo niszowej specjalizacji IT lub niestandardowej lokalizacji), raport nie mógł zostać wygenerowany.","REPORT_NOT_AVAILABLE_REASON_TECH_ISSUES":"\u003Cstrong>Tymczasowy problem techniczny\u003C\u002Fstrong> – kalkulator może mieć chwilowe trudności z przetwarzaniem danych lub aktualizacją bazy.","ARE_SALARY_REPORTS_BASED_ON_CALCULATOR_DATA_TITLE":"Czy raporty płacowe No Fluff Jobs dotyczące rynku pracy w Polsce powstają m.in. na danych dostępnych w kalkulatorze wynagrodzeń?","SALARY_REPORTS_DATA_ORIGIN_DESC":"Tak, raporty płacowe No Fluff Jobs dotyczące rynku pracy w Polsce są opracowywane m.in. na podstawie ofert pracy publikowanych na platformie. Dane te pochodzą bezpośrednio z ofert zamieszczanych przez pracodawców, co oznacza, że raporty odzwierciedlają realne widełki wynagrodzeń oferowane w danym czasie w różnych branżach i lokalizacjach. Jednocześnie raporty często powstają przy wsparciu merytorycznym naszych partnerów biznesowych.","GROSS_SALARY_CALCULATION_TITLE":"Jak wyliczana jest pensja brutto podawana przez pracodawców?","GROSS_SALARY_CALCULATION_DESC":"Pensja brutto to kwota wynagrodzenia przed odliczeniem podatków i składek na ubezpieczenia społeczne. Jest obliczana przez pracodawcę według następującego schematu.","GROSS_SALARY_BASE_AMOUNT":"\u003Cstrong>Podstawa wynagrodzenia\u003C\u002Fstrong> – czyli kwota uzgodniona między pracownikiem a pracodawcą w umowie o pracę.","GROSS_SALARY_SOCIAL_CONTRIBUTIONS":"\u003Cstrong>Składki na ubezpieczenia społeczne\u003C\u002Fstrong> – obejmują składki na ZUS, w tym emerytalne (9,76%), rentowe (1,5%) i chorobowe (2,45%).","GROSS_SALARY_HEALTH_INSURANCE":"\u003Cstrong>Składka zdrowotna\u003C\u002Fstrong> – wynosi 9% podstawy wymiaru, jednak nie jest odliczana od podatku w pełnym zakresie.","GROSS_SALARY_INCOME_TAX":"\u003Cstrong>Zaliczka na podatek dochodowy\u003C\u002Fstrong> – liczona od podstawy pomniejszonej o składki ZUS i koszty uzyskania przychodu. Podstawowe stawki PIT w Polsce to 12% (dla dochodów do 120 000 zł rocznie) oraz 32% (dla nadwyżki powyżej tej kwoty).","GROSS_NET_CALCULATION_NOTE":"Pensja brutto to kwota, od której obliczane są powyższe składki i podatki. Wynagrodzenie netto, czyli kwota “na rękę”, jest uzyskiwane po ich odjęciu.","WHY_NET_CALCULATOR_UNAVAILABLE_TITLE":"Dlaczego w kalkulatorze płac No Fluff Jobs jest niedostępny przelicznik wynagrodzenia brutto – netto","WHY_NET_CALCULATOR_UNAVAILABLE_DESC":"Nasz kalkulator wynagrodzeń został stworzony w celu ułatwienia analizy wynagrodzeń w branżach dostępnych na nofluffjobs.com. Skupiliśmy się na udostępnianiu konkretnych odpowiedzi dotyczących zarobków na stanowiskach pracy – netto w przypadku umowy B2B oraz brutto dla umowy o pracę. Kalkulator dostarcza również odpowiedzi takich jak przedział oferowanych kwot i mediana.","NET_CALCULATOR_IN_OFFERS_REMINDER":"Pamiętaj, że kwoty brutto — netto możesz sprawdzić w każdej ofercie pracy na NoFluffJobs. Jest to funkcja o nazwie oblicz \"na rękę\", dostępna w każdym ogłoszeniu o pracę.","SALARY_TRANSPARENCY_FUTURE_TITLE":"Czy zarobki w ofertach pracy będą w przyszłości jawne?","SALARY_TRANSPARENCY_EU_TREND_DESC":"W przyszłości jawność zarobków w ofertach pracy może stać się standardem, zwłaszcza w Unii Europejskiej, gdzie wprowadzane są regulacje zwiększające transparentność wynagrodzeń. Dyrektywa UE w sprawie jawności wynagrodzeń, przyjęta w 2023 r., przewiduje okoliczności podawania widełek płacowych w ofertach pracy oraz zapewnienia równości wynagrodzeń. Państwa członkowskie, w tym Polska, mają czas do 2026 r. na wdrożenie tych przepisów.","SALARY_TRANSPARENCY_POLAND_DESC":"W Polsce już teraz niektóre portale pracy, np. NoFluffJobs.com, wymagają publikowania widełek wynagrodzeń w ogłoszeniach, a trend ten zyskuje na popularności. W przyszłości można spodziewać się większej presji na pracodawców, aby ujawniali informacje o płacach, co ułatwi kandydatom podejmowanie świadomych decyzji zawodowych."}},"PAYMENT":{"BACK":"Powrót","HELP":"Potrzebujesz pomocy? Skontaktuj się z nami:","SHOW_REPORT":"Wyświetl raport","ACCESS":"Dostęp do raportu przesłaliśmy również na adres email podany podczas płatności.","SUCCESS":{"TITLE":"Dziękujemy za zakup raportu!","MSG":"Wykorzystaj wiedzę o najbardziej poszukiwanych umiejętnościach i preferencjach pracodawców\u003Cbr>, aby skuteczniej szukać pracy lub negocjować warunki zatrudnienia."},"FAILURE":{"TITLE":"Twoja płatność nie została zrealizowana","MSG":"Napotkaliśmy problem z przetworzeniem Twojej płatności.\u003Cbr>Prosimy o dokonanie ponownej próby płatności.\u003Cbr>W razie trudnośności zaprszamy do kontaktu z naszą obsługą klienta."}},"GENERATE_NEW_REPORT":"Generuj raport","GENERATE":"Generuj","CHARTS":{"UPPER_MEDIAN_TREND":"Górna mediana","MEAN_UPPER_LOWER_MEDIANS":"Środek dolnej i górnej mediany","LOWER_MEDIAN_TREND":"Dolna mediana"},"VIEW_REPORT":{"SEO":{"DEMO_TITLE":"Przykładowy Raport z Kalkulatorem wynagrodzeń od No Fluff Jobs","DEMO_DESCRIPTION":"Przeglądaj demonstracyjny raport od Kalkulatora wynagrodzeń. Nie czekaj, okryj już dziś, gdzie i _TYPE_OFFERED_THIS_ROLE_OVER_TIME":"Procentowy udział form zatrudnienia oferowanych dla wybranej roli","PERCENTAGE_EMPLOYMENT_OFFERED_FOR_THIS_ROLE":"Wykres pokazuje, jak zmieniał się trend formy zatrudnienia dla wybranej roli na przestrzeni czasu.","MOST_POPULAR_TITLES":"Najpopularniejsze tytuły ogłoszeń dla wybranej roli","JOB_TITLES_HIGHEST_NUMBER_PAGE_VIEWS":"Tytuły ogłoszeń dla wybranej roli, które miały największą liczbę odsłon w ciągu ostatnich 12 miesięcy.","JOB_TITLE":"Tytuł ogłoszenia","DETAILED_DISTRIBUTION":"Liczba ofert pracy","DETAILED_DISTRIBUTION_TEXT":"Przedział procentowy wynagrodzeń oraz liczba ogłoszeń o pracy dla określonego poziomu wynagrodzeń."}},"PLATFORM":{"AD_FORMAT":{"H1":"Atrakcyjny format ogłoszenia","H2":"Jeszcze efektywniejsze i bardziej intuicyjne wyszukiwanie ofert pracy.","SALARY":"Szybki podgląd wynagrodzenia","SALARY_TEXT":"W naszym formacie ogłoszenia wprowadziliśmy boczny pasek floating-box, który umożliwia natychmiastowe sprawdzenie najważniejszych informacji na temat stanowiska. Znajdziecie tam dane na temat:","SALARY_1":"wynagrodzenia","SALARY_2":"lokalizacji","SALARY_3":"rodzaj umowy","SALARY_4":"czasu publikacji","CLEAR_LAYOUT":"Przejrzysty układ ogłoszenia","CLEAR_LAYOUT_TEXT":"Jednokolumnowy układ informacji gwarantuje wygodne przeglądanie ofert na każdym urządzeniu.","RELEVANCE":"Tylko istotne informacje","RELEVANCE_TEXT":"Żadnego lania wody i nic nieznaczących frazesów. Nasz format ogłoszenia został idealnie dopasowany do potrzeb współczesnego rynku IT i oczekiwań pracowników tej branży.","SENIORITY":"Jasno określony poziom stanowiska","SENIORITY_TEXT":"Zastanawiasz się, czy dana oferta jest dla Ciebie odpowiednia? Dzięki precyzyjnemu widokowi ogłoszenia, od razu widać, jakiego stopnia zaawansowania oczekuje potencjalny pracodawca.","FAQ_0":"Jakie informacje znajdę w nowym formacie ogłoszenia?","FAQ_TEXT_0":"Nowy, jeszcze bardziej szczegółowy i przejrzysty, jednokolumnowy układ ogłoszenia skupia się tylko na najważniejszych informacjach z perspektywy kandydata. Boczny pasek floating-box po prawej stronie zawiera najważniejsze informacje na temat stanowiska, m.in.:\u003Cbr\u002F>&bull; wynagrodzenie\u003Cbr\u002F>&bull; możliwe lokalizacje pracy\u003Cbr\u002F>&bull; rodzaj umowy","FAQ_1":"Czy mogę porównać zarobki dla różnych rodzajów umowy?","FAQ_TEXT_1":"No Fluff Jobs to pierwszy portal w Polsce, który wprowadził wymóg podawania widełek płacowych w ogłoszeniach o pracę. W nowym formacie ogłoszenia umożliwiliśmy wybór kilku rodzajów umów w zależności od preferencji kandydata. Do każdej z nich pracodawca może przypisać inną wysokość oferowanego wynagrodzenia. Pracodawcy mogą również podać informację, czy płatne dni wolne są uwzględnione w tej stawce.","FAQ_2":"Jakie informacje o pracodawcy mogę znaleźć w ogłoszeniu?","FAQ_TEXT_2":"Na końcu ogłoszenia znajduje się sekcja About, która wyświetla najważniejsze informacje o danej firmie, czyli rok założenia, wielkość oraz lokalizację biura. About zawiera również link do większej ilości informacji na profilu firmy.","FAQ_3":"Co zmieniło się w sekcji Profil stanowiska?","FAQ_TEXT_3":"Rekruterzy zgłaszali nam, że bardzo ciężko zdefiniować było, czy praca nad “nowymi funkcjonalnościami” to np. 50% czy 60% czasu pracy. Różnice są rozmyte, a warto podawać dokładne i prawdziwe informacje. Aktualne i intuicyjne wartości do wyboru to “Nowe funkcjonalności”, “Utrzymywanie\u002F naprawa bugów\" itd. Pełniej obrazuje to zakres odpowiedzialności. Oczywiście, opcjonalnie dodać można konkretne wartości procentowe jak w poprzedniej wersji, natomiast nie jest to wymagane.","FAQ_4":"Co zmieniło się w sekcji wymagań?","FAQ_TEXT_4":"Pierwszą sekcją nowego formatu ogłoszenia są wymagania. Tu także widać podział na “Wymagania obowiązkowe” oraz “Mile widziane”. Zdaniem naszych developerów to rozwiązanie jest bardzo trafne i znacznie poprawia czytelność wymagań, ponieważ sprawia, że ogłoszenie jest klarowne i czytelne dla kandydata. ","FAQ_5":"Dlaczego dodano informację o poziomie doświadczenia?","FAQ_TEXT_5":"Zdajemy sobie sprawę, że w każdej firmie ścieżka kariery może wyglądać inaczej, dlatego zdecydowaliśmy się wprowadzić jasny podział stopnia zaawansowania na: stażystę, juniora, mida, seniora oraz eksperta. Od teraz szybko można sprawdzić, jakiego stopnia zaawansowania oczekuje dany pracodawca i czy oferta jest dla kandydata odpowiednia.","FAQ_6":"Czy mogę przeglądać ogłoszenia na urządzeniach mobilnych?","FAQ_TEXT_6":"Jednokolumnowy układ ogłoszenia został opracowany, tak by wszystkie ważne informacje były zawsze widoczne. Jest on dostosowany do urządzeń mobilnych, dzięki czemu szukanie najlepszych ofert stanie się jeszcze bardziej wygodne i komfortowe. W przypadku przeglądania portalu na urządzeniu mobilnym, zawartość floating-box, znajduje się na dole ogłoszenia. Rozwiązanie to sprawi, że najważniejsze informacje będą stale widoczne, a wybór odpowiedniej oferty pracy zajmie jeszcze mniej czasu niż dotychczas.","FAQ_7":"Jak aplikować?","FAQ_TEXT_7":"W naszym formacie ogłoszenia aplikowanie jest jeszcze łatwiejsze. W bocznym \"pływającym\" oknie wystarczy kliknąć przycisk 'Aplikuj'.","GOTO":"Przejdź do ofert pracy","STARTED":"Spróbuj samemu","STARTED_TEXT":"Znajdź wymarzoną pracę na największym portalu ogłoszeniowym IT w Polsce."},"WIZARD":{"POST_A_JOB":"Publikuj!","H1":"Najefektywniejszy sposób tworzenia ofert pracy dla branży IT","H2":"Poznaj niezwykle intuicyjny i precyzyjny kreator generowania ogłoszeń.","SECURITY":"Bezpieczeństwo","SECURITY_TEXT":"No Fluff Jobs dba o bezpieczeństwo danych zarówno Twojej firmy, jak i kandydatów. Wpisujesz jedynie najważniejsze informacje, niezbędne do przeprowadzenia skutecznej rekrutacji oraz znalezienia odpowiednich kandydatów. Codziennie tworzymy kopie zapasowe i przechowujemy je w zabezpieczonym centrum danych.","SMART_HINTS":"Inteligentne podpowiedzi","SMART_HINTS_TEXT":"Nasz intuicyjny generator tworzenia ogłoszeń zawiera inteligentne podpowiedzi i sugestie, dzięki którym dodawanie ogłoszeń stanie się łatwiejsze niż kiedykolwiek. Nie musisz zastanawiać się nad tym, jaka nazwa stanowiska będzie odpowiednia do wybranych przez ciebie wymagań oraz specyfiki pracy. Nasz kreator zrobi to za ciebie.","PRECISION":"Precyzja","PRECISION_TEXT":"Przeanalizowaliśmy tysiące aplikacji. Zebraliśmy opinie od kandydatów i dostosowaliśmy pola w formularzu tak, aby dokładnie opisywały wszystkie najważniejsze kwestie dotyczące prezentowanego stanowiska pracy. Oferta stworzona za pomocą naszego intuicyjnego kreatora będzie odpowiadała potrzebom nawet najbardziej wymagających specjalistów IT, dzięki czemu masz pewność, że otrzymasz aplikacje od osób, które idealnie pasują do danego stanowiska.","JOB_TITLE_GUIDE":"Sugerowane nazwy stanowiska","JOB_TITLE_GUIDE_TEXT":"Dzięki przewodnikowi po nazwach stanowisk użytkownicy mogą łatwo wybrać profesjonalne i najlepiej dopasowane do specjalizacji.","FLEXIBLE_TYPES":"Elastyczny wybór form zatrudnienia","FLEXIBLE_TYPES_TEXT":"Odpowiadając na nowe standardy zatrudnienia w branży IT oraz fakt, iż coraz więcej pracodawców oferuje więcej niż jeden rodzaj umowy do wyboru, umożliwiamy wprowadzanie kilku możliwych form zatrudnienia do jednego ogłoszenia (B2B, umowa o pracę itp.).","RELEVANCE":"Konkrety","RELEVANCE_TEXT":"W naszym formularzu znajdziesz tylko najważniejsze informacje dotyczące danego stanowiska. Przeanalizowaliśmy tysiące ogłoszeń i usunęliśmy pola, które okazały się nieistotne dla potencjalnego pracownika. Układ oferty jest idealnie dopasowany do potrzeb współczesnego rynku pracy IT i oczekiwań nawet najbardziej wymagających kandydatów.","STARTED":"Spróbuj samemu","STARTED_TEXT":"Znajdź najlepsze talenty na rynku na największym w Polsce portalu ogłoszeniowym dla branży IT!","FAQ_0":"Jak działają inteligentne sugestie?","FAQ_TEXT_0":"Pierwszą, szczególnie przydatną funkcjonalnością jest sugerowanie nazwy w sekcji kategorii. Nazwy kategorii podpowiadane są na podstawie wymaganych technologii tzn. opcja \"Którą wybrać?\" pozwala uzyskać podpowiedzi odnośnie do tego, jaką kategorię przypisać daną ofertę pracy. Jest to szczególnie przydatne w przypadku tworzenia ogłoszenia przez rekruterów, którzy nie posiadają szczegółowej wiedzy technicznej. Inteligentne sugestie dotyczą także proponowanej nazwy stanowiska pracy.","FAQ_1":"Czy mogę zaproponować kandydatom różne formy zatrudnienia?","FAQ_TEXT_1":"Na wielu portalach z ogłoszeniami o pracę można podawać tylko jedną formę zatrudnienia. Postanowiliśmy to zmienić i umożliwić wybór kilku rodzajów umów. Na każdą z nich można podać oddzielne informacje o wysokości oferowanego wynagrodzenia, dzięki czemu kandydat może bez problemu sprawdzić, która z możliwości będzie dla niego najlepsza. Pracodawcy mogą również podać informację, czy płatne dni wolne są uwzględnione w umowie.","FAQ_2":"Jak wrócić do wcześniejszego kroku w formularzu?","FAQ_TEXT_2":"Jeśli nie jesteście pewni, czy dobrze wypełniliście jakieś pole lub chcecie cofnąć się kilka kroków wstecz - z pomocą przyjdzie Wam intuicyjna nawigacja po wszystkich etapach dodawania ogłoszenia. Nie musicie przeklikiwać się przez wszystkie kroki po kolei. Wystarczy, że w górnej części menu wybierzecie jeden z pięciu kroków, w którym chcielibyście dokonać zmian.","FAQ_3":"Co się stanie, gdy przypadkowo zamknę okno edycji?","FAQ_TEXT_3":"Dane są automatycznie zapisane. Jeśli więc nie zapisze się któregoś etapu, nie ma powodu do zmartwień. Dane będą dostępne po powrocie do danego kruku formularza."}},"EXPIRED_OFFER":{"OFFER_CRITERIA":"Kryteria oferty:","BREAD":"Oferta pracy {{title}}wygasła.","CP_LINK":"Zobacz profil firmy"},"CMS_CATEGORY_PAGE":{"LINKS":{"MASTERCLAZZ":{"IMAGE_URL":"https:\u002F\u002Fs3.eu-central-1.amazonaws.com\u002Fstatic.nofluffjobs.com\u002Fnfj\u002Fassets\u002Fimages\u002Fseo\u002Fmasterclazz.png","TITLE":"Masterclazz","BTN_TEXT":"Program kursu","BTN_URL":"https:\u002F\u002Fnofluffjobs.com\u002Fmasterclazz\u002F"},"NFJ_INSIGHTS":{"IMAGE_URL":"https:\u002F\u002Fs3.eu idełek w przyszłości. Chcemy, żeby w ramach Salary Match były publikowane tylko takie oferty, które nie miały dotychczas widocznych widełek.","PARAGRAPH_2":"Pomysł został zaczerpnięty bezpośrednio z \u003Cstrong>unijnej dyrektywy o transparentności płac\u003C\u002Fstrong>, która zdefiniowała czym jest transparentność. Jej celem jest między innymi umożliwienie kandydat(k)om sprawiedliwej negocjacji oferowanego wynagrodzenia. Dzięki Salary&nbsp;Match jest to możliwe, bo to Ty sprawdzasz zgodność widełek z Twoimi oczekiwaniami przed złożeniem aplikacji, a pracodawca przekazuje Ci dokładne widełki na wskazanym etapie rekrutacji – jeszcze zanim rozpoczną się negocjacje."},"QUESTION_3":"Czy przekazujecie moje oczekiwania pracodawcy?","ANSWER_3":{"PARAGRAPH_1":"Twoje oczekiwania nie są przekazywane pracodawcy.","PARAGRAPH_2":"Proces sprawdzania dopasowania Twoich oczekiwań finansowych do widełek oferowanych przez pracodawcę jest \u003Cstrong>całkowicie niezależny\u003C\u002Fstrong> od aplikowania – po sprawdzeniu dopasowania wcale nie musisz aplikować. Możesz też aplikować, nie sprawdzając dopasowania, ale w sumie ... pewnie warto to zrobić zanim zaaplikujesz. ;)"},"QUESTION_4":"Co z ofertami z widocznymi widełkami?","ANSWER_4":{"PARAGRAPH_1":"W tej kwestii nic się nie zmienia – nadal walczymy o jak największą liczbę takich ofert na NFJ. W ramach Salary&nbsp;Match publikowane są tylko takie oferty, które nie miały dotychczas widocznych widełek.","PARAGRAPH_2":"W dalszym ciągu masz i będziesz mieć dostęp \u003Cstrong>do tysięcy ofert z widełkami widocznymi w ogłoszeniu\u003C\u002Fstrong>, a do tego zyskujesz wybór ofert atrakcyjnych brandów, wcześniej nieobecnych na NFJ, w których sprawdzisz zgodność z Twoimi oczekiwaniami finansowymi."},"QUESTION_5":"Dlaczego właściwie te widełki nie są widoczne?","ANSWER_5":{"PARAGRAPH_1":"Funkcja Salary&nbsp;Match skierowana jest do pracodawców, którzy nie są jeszcze gotowi na publikację widełek (np. centrala międzynarodowej firmy zakazuje publikacji widełek widocznych w ogłoszeniu), ale są w stanie podać je w systemie NFJ, abyś Ty mógł(a) sprawdzić, czy pasują do Twoich oczekiwań. Jest to kompromis pomiędzy potrzebami kandydatów a obecnymi możliwościami pracodawców i dużo lepsze rozwiązanie od wszechobecnych na rynku ogłoszeń bez widełek. Dla wielu firm Salary Match będzie pierwszym krokiem na drodze do większej transparentności."},"QUESTION_6":"Jak działa filtrowanie widełek Salary&nbsp;Match w wyszukiwarce?","ANSWER_6":{"PARAGRAPH_1":"Widełki ofert Salary&nbsp;Match możesz filtrować w wyszukiwarce tylko w przybliżeniu.","PARAGRAPH_2":"Kwota wynagrodzenia podana przez Ciebie przy filtrowaniu zostaje zaokrąglona, żebyśmy mogli wyszukać dla Ciebie \u003Cstrong>oferty Salary&nbsp;Match.\u003C\u002Fstrong>","PARAGRAPH_3":"Przykładowo, jak widać powyżej, jeśli interesuje Cię wynagrodzenie co najmniej 11k, to wyświetlą Ci się oferty z widocznymi widełkami 11k i więcej (jak dotychczas). Natomiast dla ofert Salary&nbsp;Match, ze względu na zaokrąglenie, zobaczysz oferty w których możesz zarobić 10k lub więcej."}}},"DISCLOSED_TITLE":"Widełki","DISCLOSED_OPTIONS":{"VISIBLE":"Widełki widoczne w ofercie pracy.","BEFORE_FIRST_INTERVIEW":"Widełki przekazane przed pierwszą rozmową.","AT_FIRST_INTERVIEW":"Widełki przekazane na pierwszej rozmowie.","AT_SECOND_INTERVIEW":"Widełki przekazane na drugiej rozmowie.","AT_THIRD_INTERVIEW":"Widełki przekazane na trzeciej rozmowie.","AT_LAST_INTERVIEW":"Widełki przekazane na ostatniej rozmowie."},"DISCLOSED_INFO":{"TITLE":"Sprawdź Salary&nbsp;Match","BEFORE_FIRST_INTERVIEW":"Dokładne widełki poznasz \u003Cstrong>przed pierwszą rozmową\u003C\u002Fstrong>.","AT_FIRST_INTERVIEW":"Dokładne widełki poznasz \u003Cstrong>na pierwszej rozmowie\u003C\u002Fstrong>.","AT_SECOND_INTERVIEW":"Dokładne widełki poznasz \u003Cstrong>na drugiej rozmowie\u003C\u002Fstrong>.","AT_THIRD_INTERVIEW":"Dokładne widełki poznasz \u003Cstrong>na trzeciej rozmowie\u003C\u002Fstrong>.","AT_LAST_INTERV
