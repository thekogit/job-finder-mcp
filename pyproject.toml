[project]
name = "job-scout"
version = "0.1.0"
description = "Aggregator and normalizer for job offers across Polish tech and general portals via Model Context Protocol (MCP)"
readme = "README.md"
authors = [
    { name = "Eliasz Dobrzański", email = "73884870+thekogit@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx[http2]>=0.28.1",
    "mcp<2",
    "playwright>=1.63.0",
    "pydantic>=2.0",
    "selectolax>=1.0.0",
    "tzdata>=2026.5",
]

[project.scripts]
job-scout = "job_scout.server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy<2",
    "pathspec==1.0.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests as live internet smoke tests (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
